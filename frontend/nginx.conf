# Serve the built SPA and reverse-proxy the API to the backend service. Single origin -> no CORS,
# which matches the app's relative baseUrl "/" (see src/api/client.ts).
server {
    listen 80;
    server_name _;

    # Request-body ceiling (security hardening PR 3): 1 MB for every route (nginx's own default, stated here so it
    # is visible), raised to 25 MB on exactly two locations below, the triage-session autosave and the promote. The
    # app bounds every field on its own as well (backend/domain/text_types.py); this stops an oversized body before
    # it reaches the app. backend/tests/ops/test_nginx_body_limits.py reads this file.
    client_max_body_size 1m;

    # Compress text on the wire, for the proxied /api JSON and the SPA's own JS/CSS alike (server level,
    # so both locations inherit it). The research dashboards return multi-megabyte JSON (MEASURED: a
    # 365-day filing-stream card is ~5.0 MB, ~0.70 MB gzipped) and went out uncompressed. Level 5: on that
    # payload level 6 saves ~3% more and level 9 ~6%, for more CPU on every uncached dynamic response. text/html is always
    # compressed by nginx and is not listed. gzip_vary adds `Vary: Accept-Encoding` so a cache never
    # serves the gzipped body to a client that did not ask for it. gzip_proxied is left at its default
    # (`off`): that governs requests that arrive through another proxy (a `Via` header), not the
    # upstream response from the backend, which is compressed like any other. Brotli is not in the
    # nginx:alpine base image, so it is not offered.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # Browser security headers (security hardening PR 4a), on EVERY response — the SPA's files and the proxied
    # /api/, /mcp and OAuth routes alike; `always` puts them on error responses too. nginx inherits add_header
    # into a location only when that location sets NO add_header of its own: a location that ever adds one must
    # repeat all four (backend/tests/ops/test_nginx_headers.py fails otherwise).
    # - nosniff: a response is only ever read as its declared type.
    # - Referrer-Policy: a link out sends our origin, never the path or query (?asof=, thesis ids).
    # - frame-ancestors 'none' is ENFORCED: no site can frame the app (the OAuth consent page's Allow button).
    # - The full policy is REPORT-ONLY for now: the browser logs what it would block and blocks nothing. Once the
    #   operator has loaded the stack and found no violation in the console, a one-line change makes it
    #   enforcing (docs/DEPLOY.md). No HSTS here: nginx serves plain port 80; HSTS belongs to the TLS layer in
    #   front of it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API surface, consolidated under /api (see src/api/client.ts). The trailing slash on
    # proxy_pass strips the prefix — /api/theses hits the backend as /theses — so the backend and
    # the OpenAPI contract never carry it. Keep in sync with the dev proxy in vite.config.ts.
    # The 300s timeouts exist for the workbench draft-chain research pass (Opus + web search, runs
    # minutes; a 60s default would 504 mid-call and the client would re-fire — the $8-and-nothing
    # amplification), kept in concert with llm_research_timeout_s. They are a ceiling, not a delay,
    # now shared by the whole API surface.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The two routes that legitimately carry a large body get 25 MB, on EXACT locations only (security hardening
    # PR 3). The promote (POST /api/workbench/theses) is a full-replace resend of the whole card; the triage-session
    # autosave (PUT/GET/DELETE /api/workbench/theses/<uuid>/triage-session) carries the editor's working state (a big
    # discovery draft of ~1600+ names serializes to ~1.6 MB; the app refuses one over 25 MB itself). Each proxies
    # exactly like /api/ above. No add_header here: a location that sets its own headers drops the server's.
    location = /api/workbench/theses {
        client_max_body_size 25m;
        proxy_pass http://backend:8000/workbench/theses;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # (quoted: nginx requires a regex holding "{" or "}" to be quoted)
    location ~ "^/api/workbench/theses/[0-9a-fA-F-]{36}/triage-session$" {
        client_max_body_size 25m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The hosted agent tools endpoint (docs/AGENT_TOOLS.md §Hosted endpoint): an exact location, never a prefix,
    # so /mcp is served as /mcp (a redirect to /mcp/ would strip a client's Authorization header). SSE replies
    # need buffering off. With ALPHADECK_PUBLIC_ORIGIN unset the backend answers 404 here (no route): harmless.
    location = /mcp {
        proxy_pass http://backend:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # RFC 9728 protected-resource metadata, served by the backend without the /api prefix.
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Our own OAuth sign-in for the hosted endpoint (docs/CONNECTORS.md): the authorization server's five
    # routes, served by the backend at the same paths (no /api prefix, no strip). EXACT locations: `location =`
    # beats `location /`, so the SPA fallback never catches /authorize. The consent page itself
    # (/oauth/consent/<id>) is the SPA's, and its reads go through /api like every other page.
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://backend:8000/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
    }
    location = /authorize {
        proxy_pass http://backend:8000/authorize;
        proxy_set_header Host $host;
    }
    location = /token {
        proxy_pass http://backend:8000/token;
        proxy_set_header Host $host;
    }
    location = /register {
        proxy_pass http://backend:8000/register;
        proxy_set_header Host $host;
    }
    location = /revoke {
        proxy_pass http://backend:8000/revoke;
        proxy_set_header Host $host;
    }
}
